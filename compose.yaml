services:
  database:
    image: docker.io/library/postgres:18.6-alpine
    environment:
      POSTGRES_USER: hedgedoc
      POSTGRES_PASSWORD: ${MD_EDIT_DB_PASSWORD:?Run ./configure.sh first}
      POSTGRES_DB: hedgedoc
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    image: quay.io/hedgedoc/hedgedoc:1.12.0
    environment:
      CMD_DB_URL: postgres://hedgedoc:${MD_EDIT_DB_PASSWORD}@database:5432/hedgedoc
      CMD_DOMAIN: ${MD_EDIT_PUBLIC_HOST:?Run ./configure.sh first}
      CMD_PROTOCOL_USESSL: "false"
      CMD_HSTS_ENABLE: "false"
      CMD_URL_ADDPORT: "true"
      CMD_SESSION_SECRET: ${MD_EDIT_SESSION_SECRET:?Run ./configure.sh first}
      CMD_ALLOW_ANONYMOUS: ${MD_EDIT_ALLOW_ANONYMOUS:-true}
      CMD_ALLOW_ANONYMOUS_EDITS: ${MD_EDIT_ALLOW_ANONYMOUS_EDITS:-false}
      CMD_ALLOW_EMAIL_REGISTER: ${MD_EDIT_ALLOW_EMAIL_REGISTER:-true}
      CMD_DEFAULT_PERMISSION: ${MD_EDIT_DEFAULT_PERMISSION:-freely}
      CMD_ENABLE_STATS_API: "false"
    ports:
      - "${MD_EDIT_BIND_IP:-0.0.0.0}:3000:3000"
    volumes:
      - uploads:/hedgedoc/public/uploads
    restart: unless-stopped

volumes:
  database:
  uploads:
